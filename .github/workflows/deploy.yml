name: Deploy static frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Minecraft Server Auto-Telemetry Tracker"]
    types:
      - completed
  # Also allow manual triggering or starting from other workflows if needed
  workflow_dispatch:

# Grant permissions required for building and deploying Actions to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from messing with the state
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
